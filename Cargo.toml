[package]
name = "bankholidays"
version = "1.3.1"
authors = ["David Hewson <dten@hewson.dev>"]

description = "Bank Holidays for England & Wales in Rust"
homepage = "https://github.com/dten/bankholidays"
repository = "https://github.com/dten/bankholidays"
keywords = ["bankholiday", "england", "uk"]
readme = "README.md"
license = "MIT"
edition = "2021"
rust-version = "1.81"

[dependencies]
chrono = { version = ">=0.2.0", default-features = false, optional = true }
computus = "2.0.0"
jiff = { version = ">=0.1", default-features = false, optional = true }
