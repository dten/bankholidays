name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test (chrono ${{ matrix.chrono }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chrono: ["0.2.25", "0.3.0", "0.4.0", "latest"]

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Pin chrono version
        if: matrix.chrono != 'latest'
        run: cargo update -p chrono --precise ${{ matrix.chrono }}
      - run: cargo test

  lint:
    name: Fmt & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy
